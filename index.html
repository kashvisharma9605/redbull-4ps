  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"2\" style=\"margin:14px 0 0;font-size:52px;font-weight:800\"><span style=\"display:inline-block;padding:10px 28px;background:#FFD300;color:#0b0b14;border:8px solid #F4EBEE;letter-spacing:.02em\">E&amp;IPs EL Presentation<\u002Fspan><\u002Fp>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"02 Hook\" style=\"background:#FFD300;--c:#E21B4D\"><div class=\"in\">\n<div class=\"gw\" style=\"left:-50px;top:640px;font-size:600px;color:rgba(11,11,20,.09)\">443<\u002Fdiv>\n<div style=\"position:absolute;left:90px;top:80px;width:660px\">\n<h2 style=\"font-size:112px\">~443 cans. Every second.<\u002Fh2>\n<div style=\"height:36px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:30px\">In 2025, 13.969 billion cans of Red Bull were sold worldwide, which works out to about 443 every second.<\u002Fp>\n<p class=\"b st\" data-s=\"2\" style=\"font-size:30px\">Turnover reached EUR 12.196 billion, and the drink is sold in 178 countries.<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:30px\">It started in 1987 as a Thai drink, Krating Daeng, adapted for Europe.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card pp\" data-s=\"1\" style=\"left:800px;top:120px;width:1030px;height:450px;background:#E21B4D;--r:-1deg\"><div class=\"tab\">CANS SOLD<\u002Fdiv>\n<div style=\"position:absolute;left:50px;top:76px;display:flex;align-items:baseline;gap:22px;color:#F4EBEE\"><span class=\"num\" id=\"n1\" style=\"font-size:250px\">0.000<\u002Fspan><span class=\"num\" style=\"font-size:84px\">billion<\u002Fspan><\u002Fdiv>\n<div class=\"tg\" style=\"position:absolute;left:50px;bottom:40px\"><i style=\"background:#FFD300\"><\u002Fi><span style=\"padding-left:44px\"><b class=\"num\" id=\"tk\" style=\"font-size:66px;font-weight:400\">+0<\u002Fb><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"card pp\" data-s=\"2\" style=\"left:800px;top:670px;width:500px;height:300px;background:#000B8D;color:#F4EBEE;--r:1.5deg\"><div class=\"tab\">TURNOVER<\u002Fdiv>\n<div style=\"position:absolute;left:36px;top:70px;display:flex;align-items:baseline;gap:14px\"><span class=\"num\" id=\"n2\" style=\"font-size:150px\">0.000<\u002Fspan><\u002Fdiv>\n<div class=\"num\" style=\"position:absolute;left:36px;bottom:26px;font-size:50px;color:#FFD300;letter-spacing:.04em\">BILLION EUR<\u002Fdiv><\u002Fdiv>\n<div class=\"card pp\" data-s=\"2\" style=\"left:1340px;top:670px;width:490px;height:300px;background:#F4EBEE;--r:-1.5deg\"><div class=\"tab\">COUNTRIES<\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;top:30px;bottom:0;display:flex;align-items:center;justify-content:center\"><span class=\"num\" id=\"n3\" style=\"font-size:210px\">0<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"src\">Red Bull company facts, 2025<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"03 Twist\" style=\"background:#E21B4D;color:#F4EBEE;--c:#FFD300\"><div class=\"in\">\n<div style=\"position:absolute;left:80px;top:70px;width:670px\">\n<h2 style=\"font-size:104px\">Same drink. Different game.<\u002Fh2>\n<div style=\"height:30px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:30px\">Red Bull isn't the only energy drink. Monster, Sting and plenty of others sell caffeine in a can.<\u002Fp>\n<p class=\"b st\" data-s=\"2\" style=\"font-size:30px\">Even so, it held more than 35% of the US market in 2025.<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:30px\">In 2025, Brand Finance valued the brand at €8.7 billion, ranking it 238th globally.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card pp\" data-s=\"3\" style=\"left:810px;top:110px;width:610px;height:640px;background:#F4EBEE;color:#0b0b14;--r:-1deg\"><div class=\"tab\">BRAND VALUE<\u002Fdiv>\n<div id=\"gauge\" style=\"position:absolute;left:30px;top:70px;width:540px;height:320px\"><\u002Fdiv>\n<div class=\"num\" id=\"gv\" data-pre=\"€\" data-suf=\"B\" style=\"position:absolute;left:0;right:0;top:370px;text-align:center;font-size:190px;color:#E21B4D\">€0.0B<\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;bottom:30px;text-align:center;font-weight:800;font-size:26px;letter-spacing:.1em\">BRAND FINANCE · 2025<\u002Fdiv><\u002Fdiv>\n<div class=\"card pp\" data-s=\"2\" style=\"left:1460px;top:110px;width:370px;height:380px;background:#FFD300;color:#0b0b14;--r:1.5deg\"><div class=\"tab\">US MARKET<\u002Fdiv>\n<div id=\"donut\" style=\"position:absolute;left:55px;top:56px;width:260px;height:260px\"><\u002Fdiv>\n<div class=\"num\" style=\"position:absolute;left:0;width:100%;top:128px;text-align:center;font-size:76px;color:#0b0b14\">35%+<\u002Fdiv><\u002Fdiv>\n<div class=\"card pp\" data-s=\"3\" style=\"left:1460px;top:550px;width:370px;height:200px;background:#000B8D;color:#F4EBEE;--r:-1deg\"><div class=\"tab\">GLOBAL RANK<\u002Fdiv>\n<div class=\"num\" id=\"rk\" data-suf=\"th\" style=\"position:absolute;left:0;width:100%;top:46px;text-align:center;font-size:130px;color:#FFD300\">0th<\u002Fdiv><\u002Fdiv>\n<div class=\"card pp st\" data-s=\"4\" style=\"left:80px;top:830px;width:1580px;height:170px;background:#000B8D;border-color:#FFD300;border-width:8px;padding:0 44px;display:flex;align-items:center;font-size:38px;font-weight:700;line-height:1.2\"><span><b style=\"color:#FFD300\">The product may have competitors, but a brand built on smart positioning over time doesn't.<\u002Fb> People buy into a personality of risk, speed and edge, and the brand carries the can.<\u002Fspan><\u002Fdiv>\n<div class=\"src\" style=\"top:788px;bottom:auto;left:810px\">Brand Finance Global 500, 2025 · GuruFocus, 2025<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"04 4P wheel\" style=\"background:#F4EBEE;--c:#0b0b14\"><div class=\"in\">\n<div class=\"gw\" style=\"left:560px;top:640px;font-size:640px;color:#D9D4CE\">4Ps<\u002Fdiv>\n<div id=\"wheel\"><\u002Fdiv>\n<div class=\"pp\" data-s=\"1\" style=\"position:absolute;left:60px;top:130px;width:480px;--r:-2deg\"><div class=\"hd\" style=\"display:inline-block;background:#E21B4D;color:#F4EBEE;font-size:80px;padding:8px 24px;border:6px solid #0b0b14;font-family:Anton,Impact,sans-serif;text-transform:uppercase\">Product<\u002Fdiv><p style=\"font-size:38px;font-weight:700;margin:16px 0 0;line-height:1.15\">One can. Barely changed.<\u002Fp><\u002Fdiv>\n<div class=\"pp\" data-s=\"2\" style=\"position:absolute;left:1380px;top:130px;width:480px;--r:2deg\"><div class=\"hd\" style=\"display:inline-block;background:#FFD300;font-size:80px;padding:8px 24px;border:6px solid #0b0b14;font-family:Anton,Impact,sans-serif;text-transform:uppercase\">Price<\u002Fdiv><p style=\"font-size:38px;font-weight:700;margin:16px 0 0;line-height:1.15\">Premium, on purpose<\u002Fp><\u002Fdiv>\n<div class=\"pp\" data-s=\"3\" style=\"position:absolute;left:1380px;top:650px;width:480px;--r:-2deg\"><div class=\"hd\" style=\"display:inline-block;background:#1D19AC;color:#F4EBEE;font-size:80px;padding:8px 24px;border:6px solid #0b0b14;font-family:Anton,Impact,sans-serif;text-transform:uppercase\">Place<\u002Fdiv><p style=\"font-size:38px;font-weight:700;margin:16px 0 0;line-height:1.15\">Wherever energy runs low<\u002Fp><\u002Fdiv>\n<div class=\"pp\" data-s=\"4\" style=\"position:absolute;left:60px;top:650px;width:480px;--r:2deg\"><div class=\"hd\" style=\"display:inline-block;background:#000B8D;color:#F4EBEE;font-size:80px;padding:8px 24px;border:6px solid #0b0b14;font-family:Anton,Impact,sans-serif;text-transform:uppercase\">Promotion<\u002Fdiv><p style=\"font-size:38px;font-weight:700;margin:16px 0 0;line-height:1.15\">A media house that happens to sell drinks<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"05 Product\" style=\"background:#E21B4D;color:#F4EBEE;--c:#FFD300\"><div class=\"in\">\n<div class=\"gw\" style=\"left:260px;top:700px;font-size:560px;color:rgba(255,255,255,.14)\">WIIINGS<\u002Fdiv>\n<div class=\"mw\" data-p=\"0\"><\u002Fdiv>\n<div class=\"vt\" style=\"left:44px;top:200px;font-size:120px;color:#FFD300\">PRODUCT<\u002Fdiv>\n<div style=\"position:absolute;left:190px;top:100px;width:740px\">\n<h2 style=\"font-size:104px\">Don't fix what gives wings<\u002Fh2>\n<div style=\"height:34px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:32px\">The hero product is the same slim silver-blue can it has always been.<\u002Fp>\n<p class=\"b st\" data-s=\"2\" style=\"font-size:32px\">The range has expanded around it with the original, Sugarfree, Zero and the Editions.<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:32px\">In India, Editions like Watermelon (Red) and Açai Berry (Purple) add novelty without touching the core.<\u002Fp>\n<p class=\"b st\" data-s=\"4\" style=\"font-size:32px\">What you're really buying is focus, endurance and edge, not just taste.<\u002Fp>\n<\u002Fdiv>\n<div style=\"position:absolute;left:1000px;top:70px;display:flex;flex-wrap:wrap;gap:18px;width:880px\">\n<div class=\"tg pp\" data-s=\"2\"><i style=\"background:#E21B4D\"><\u002Fi><span>Original<\u002Fspan><\u002Fdiv>\n<div class=\"tg pp\" data-s=\"2\"><i style=\"background:#FFD300\"><\u002Fi><span>Sugarfree<\u002Fspan><\u002Fdiv>\n<div class=\"tg pp\" data-s=\"2\"><i style=\"background:#D9D4CE\"><\u002Fi><span>Zero<\u002Fspan><\u002Fdiv>\n<div class=\"tg pp\" data-s=\"2\"><i style=\"background:#F4EBEE\"><\u002Fi><span>Editions<\u002Fspan><\u002Fdiv>\n<div class=\"tg pp\" data-s=\"3\"><i style=\"background:#E21B4D\"><\u002Fi><span>Watermelon (Red)<\u002Fspan><\u002Fdiv>\n<div class=\"tg pp\" data-s=\"3\"><i style=\"background:#1D19AC\"><\u002Fi><span>Açai Berry (Purple)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"ph\" data-n=\"01\" data-l=\"Red Bull range / Editions\" style=\"left:1000px;top:290px;width:440px;height:620px;transform:rotate(-2deg)\"><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"06 Price\" style=\"background:#FFD300;--c:#E21B4D\"><div class=\"in\">\n<div class=\"gw\" style=\"left:-30px;top:520px;font-size:760px;color:rgba(11,11,20,.08)\">₹125<\u002Fdiv>\n<div class=\"mw\" data-p=\"1\"><\u002Fdiv>\n<div class=\"vt\" style=\"right:30px;top:60px;font-size:100px;color:#E21B4D;transform:none\">PRICE<\u002Fdiv>\n<div id=\"cans\" style=\"position:absolute;left:60px;top:400px;width:860px;height:640px\"><\u002Fdiv>\n<div style=\"position:absolute;left:1010px;top:50px;width:700px\">\n<h2 style=\"font-size:82px\">Pay more, get less (and still buy it)<\u002Fh2>\n<div style=\"height:20px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:26px\">On BigBasket, a 250 ml Red Bull is ₹125, while a 350 ml Monster is ₹113.<\u002Fp>\n<p class=\"b st\" data-s=\"2\" style=\"font-size:26px\">That's 40% less drink for more money, and people still pick it.<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:26px\">Premium pricing signals a premium product, so Red Bull stays out of discount wars.<\u002Fp>\n<p class=\"b st\" data-s=\"4\" style=\"font-size:26px\">Every flavour, from the original to the Yellow and Pink Editions, sells at the same ₹125, so no variant looks like the \"cheap\" option.<\u002Fp>\n<p class=\"b st\" data-s=\"5\" style=\"font-size:26px\">Discounts are kept small and tied to bulk buys: a 4-pack is ₹480 instead of ₹500. This rewards loyal buyers without cheapening the single can.<\u002Fp>\n<\u002Fdiv>\n<div class=\"src\" style=\"left:1010px;bottom:30px;color:#5a5648\">BigBasket, Oct 2026<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"07 Place\" style=\"background:#1D19AC;color:#F4EBEE;--c:#FFD300\"><div class=\"in\">\n<div class=\"gw\" style=\"left:-40px;top:620px;font-size:640px;color:rgba(255,255,255,.1)\">HERE<\u002Fdiv>\n<div class=\"mw\" data-p=\"2\"><\u002Fdiv>\n<div class=\"vt\" style=\"left:44px;top:200px;font-size:120px;color:#FFD300\">PLACE<\u002Fdiv>\n<div style=\"position:absolute;left:190px;top:120px;width:760px\">\n<h2 style=\"font-size:112px\">Be where tired people are<\u002Fh2>\n<div style=\"height:40px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:34px\">Campuses, gyms, clubs, petrol pumps and exam season<\u002Fp>\n<p class=\"b st\" data-s=\"2\" style=\"font-size:34px\">Student Brand Managers push visibility and availability in outlets on and around campus.<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:34px\">Ambassadors help sales open new distribution points on campus and beyond.<\u002Fp>\n<p class=\"b st\" data-s=\"4\" style=\"font-size:34px\">In India, it's on quick commerce too: Editions launched on Amazon and Swiggy Instamart.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ph\" data-n=\"02\" data-l=\"Campus outlet / gym fridge\" style=\"left:1010px;top:150px;width:520px;height:760px;transform:rotate(2deg);border-color:#FFD300;color:#F4EBEE\"><\u002Fdiv>\n<div class=\"src\" style=\"left:190px;color:#D9D4CE\">Red Bull SBM listing (Hong Kong), 2025<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"08 Promotion\" style=\"background:#000B8D;color:#F4EBEE;--c:#FFD300\"><div class=\"in\">\n<div class=\"gw\" style=\"left:-30px;top:640px;font-size:600px;color:rgba(255,255,255,.07)\">MEDIA<\u002Fdiv>\n<div class=\"mw\" data-p=\"3\"><\u002Fdiv>\n<div class=\"vt\" style=\"left:44px;top:200px;font-size:120px;color:#FFD300\">PROMOTION<\u002Fdiv>\n<div style=\"position:absolute;left:190px;top:100px;width:1000px\">\n<h2 id=\"h8\" style=\"font-size:120px\">The strategy has a name<\u002Fh2>\n<div style=\"height:36px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:32px\">Red Bull runs on <b style=\"color:#FFD300\">content marketing and experiential marketing<\u002Fb>: it creates events and stories people actually want to watch, instead of interrupting them with ads.<\u002Fp>\n<p class=\"st\" data-s=\"2\" style=\"font-size:36px;font-weight:800;line-height:1.2;margin:0 0 26px;padding:22px 30px;border:7px solid #FFD300;background:#1D19AC;transform:rotate(-1deg)\">Mateschitz put it this way: \"We don't bring the product to the consumer, we bring consumers to the product.\"<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:32px\">It owns its own media, including The Red Bulletin, Servus and Terra Mater.<\u002Fp>\n<p class=\"b st\" data-s=\"4\" style=\"font-size:32px\">It owns teams too: the New York Red Bulls and RB Leipzig.<\u002Fp>\n<p class=\"b st\" data-s=\"5\" style=\"font-size:32px\">The goal is to make Red Bull a lifestyle choice that continues after university.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ph\" data-n=\"03\" data-l=\"Red Bull event crowd\" style=\"left:1280px;top:600px;width:540px;height:340px;transform:rotate(2deg);border-color:#FFD300;color:#F4EBEE\"><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"09 Side quests\" style=\"background:#D9D4CE;--c:#E21B4D\"><div class=\"in\">\n<div class=\"gw\" style=\"left:520px;top:640px;font-size:640px;color:rgba(11,11,20,.07)\">1992<\u002Fdiv>\n<div class=\"vt\" style=\"left:28px;top:80px;font-size:80px;color:#E21B4D\">SIDE QUESTS<\u002Fdiv>\n<div style=\"position:absolute;left:120px;top:60px;width:1010px\">\n<h2 style=\"font-size:66px;line-height:1.02\">Things an energy drink company has no business doing (but did anyway)<\u002Fh2>\n<div style=\"height:26px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:26px\"><b>Red Bull Racing (F1):<\u002Fb> In about 20 years in F1, the team has won eight drivers' titles and six constructors' titles, from Vettel's four in a row to the Verstappen era.<\u002Fp>\n<p class=\"b st\" data-s=\"2\" style=\"font-size:26px\"><b>Red Bull Symphonic (music):<\u002Fb> On 26 October 2023, Metro Boomin performed with a 43-piece orchestra at the Dolby Theatre in LA, reimagining his hits. Rick Ross had headlined the first edition.<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:26px\"><b>Red Bull Flugtag (chaos):<\u002Fb> Teams build homemade human-powered flying machines and launch them off a ~9 m pier into water, though most barely fly. It started in Vienna in 1992.<\u002Fp>\n<p class=\"b st\" data-s=\"4\" style=\"font-size:26px\"><b>Red Bull BC One (dance):<\u002Fb> The breaking world final came to India in 2019, with 4,000+ spectators at Dome NSCI.<\u002Fp>\n<p class=\"b st\" data-s=\"5\" style=\"font-size:26px\"><b>Red Bull Campus Clutch (gaming):<\u002Fb> A global collegiate Valorant tournament with Indian university qualifiers.<\u002Fp>\n<p class=\"st\" data-s=\"6\" style=\"font-size:28px;font-weight:800;margin:6px 0 0;padding:12px 22px;background:#0b0b14;color:#FFD300;display:inline-block;transform:rotate(-1deg)\">None of these sell a single can directly. All of them build the brand.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card pp\" data-s=\"1\" style=\"left:1170px;top:90px;width:670px;height:350px;background:#F4EBEE;--r:1deg\"><div class=\"tab\">DRIVERS 8 · CONSTRUCTORS 6<\u002Fdiv><div id=\"trophies\" style=\"position:absolute;left:14px;right:14px;top:34px;bottom:10px\"><\u002Fdiv><\u002Fdiv>\n<div class=\"ph pp\" data-s=\"3\" data-n=\"04\" data-l=\"Flugtag crash\" style=\"left:1170px;top:490px;width:320px;height:440px;--r:-2deg\"><\u002Fdiv>\n<div class=\"ph pp\" data-s=\"4\" data-n=\"05\" data-l=\"BC One crowd, Mumbai\" style=\"left:1530px;top:490px;width:310px;height:200px;--r:2deg\"><\u002Fdiv>\n<div class=\"ph pp\" data-s=\"2\" data-n=\"06\" data-l=\"Symphonic stage\" style=\"left:1530px;top:730px;width:310px;height:200px;--r:-1deg\"><\u002Fdiv>\n<div class=\"src\" style=\"left:120px;color:#5a5648\">Crash.net · Red Bull · OML · AFK Gaming<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"10 Backfire\" style=\"background:#0b0b14;color:#F4EBEE;--c:#FFD300\"><div class=\"in\">\n<div class=\"gw\" style=\"left:-30px;top:560px;font-size:760px;color:rgba(255,211,0,.09)\">$13M<\u002Fdiv>\n<div style=\"position:absolute;left:110px;top:80px;width:880px\">\n<h2 style=\"font-size:130px;color:#FFD300\">The $13 million slogan<\u002Fh2>\n<div style=\"height:40px\"><\u002Fdiv>\n<p class=\"b st\" data-s=\"1\" style=\"font-size:34px\">In 2014, Red Bull settled a US class action for US$13 million over claims that \"gives you wings\" and its performance claims misled buyers.<\u002Fp>\n<p class=\"b st\" data-s=\"2\" style=\"font-size:34px\">Buyers could claim $10 cash or $15 worth of Red Bull products.<\u002Fp>\n<p class=\"b st\" data-s=\"3\" style=\"font-size:34px\">Red Bull denied wrongdoing and said it settled to avoid the cost of litigation.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card pp\" data-s=\"2\" style=\"left:1090px;top:170px;width:340px;height:520px;background:#E21B4D;--r:-2deg\"><div class=\"tab\">CASH<\u002Fdiv><div class=\"num\" style=\"position:absolute;left:0;width:100%;top:150px;text-align:center;font-size:190px;color:#F4EBEE\">$10<\u002Fdiv><\u002Fdiv>\n<div class=\"card pp\" data-s=\"2\" style=\"left:1470px;top:230px;width:340px;height:520px;background:#FFD300;--r:2deg\"><div class=\"tab\">IN PRODUCTS<\u002Fdiv><div class=\"num\" style=\"position:absolute;left:0;width:100%;top:150px;text-align:center;font-size:190px\">$15<\u002Fdiv><\u002Fdiv>\n<div class=\"pp st\" data-s=\"4\" style=\"position:absolute;left:110px;top:800px;width:1440px;padding:26px 40px;background:#FFD300;color:#0b0b14;border:8px solid #F4EBEE;font-size:44px;font-weight:800;transform:rotate(-1deg)\"><span><b style=\"font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.04em;background:#E21B4D;color:#F4EBEE;padding:0 14px;margin-right:16px\">Lesson:<\u002Fb>bold promotion still needs claims you can back up.<\u002Fspan><\u002Fdiv>\n<div class=\"src\" style=\"left:110px;bottom:40px;color:#D9D4CE;bottom:26px\">SBS · NBC Philadelphia<\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"11 Takeaways\" style=\"background:#F4EBEE;--c:#0b0b14\"><div class=\"in\">\n<div class=\"gw\" style=\"left:520px;top:700px;font-size:560px;color:rgba(11,11,20,.06)\">4Ps<\u002Fdiv>\n<div class=\"vt\" style=\"left:60px;top:90px;font-size:56px;color:#E21B4D\">Takeaways for entrepreneurs<\u002Fdiv>\n<div class=\"card pp\" data-s=\"1\" style=\"left:290px;top:190px;width:350px;height:660px;background:#E21B4D;color:#F4EBEE;--r:-2deg\"><div class=\"tab\">P1<\u002Fdiv><div class=\"num\" style=\"position:absolute;left:30px;top:44px;font-size:80px;color:#FFD300\">PRODUCT<\u002Fdiv><p style=\"position:absolute;left:30px;right:26px;top:170px;margin:0;font-size:38px;font-weight:700;line-height:1.2\">You don't need the best product, just a clear identity around a good one.<\u002Fp><\u002Fdiv>\n<div class=\"card pp\" data-s=\"2\" style=\"left:680px;top:110px;width:350px;height:700px;background:#FFD300;--r:1.5deg\"><div class=\"tab\">P2<\u002Fdiv><div class=\"num\" style=\"position:absolute;left:30px;top:44px;font-size:80px\">PRICE<\u002Fdiv><p style=\"position:absolute;left:30px;right:26px;top:170px;margin:0;font-size:38px;font-weight:700;line-height:1.2\">Premium pricing works only when the brand earns it.<\u002Fp><\u002Fdiv>\n<div class=\"card pp\" data-s=\"3\" style=\"left:1070px;top:230px;width:350px;height:660px;background:#1D19AC;color:#F4EBEE;--r:-1.5deg\"><div class=\"tab\">P3<\u002Fdiv><div class=\"num\" style=\"position:absolute;left:30px;top:44px;font-size:80px;color:#FFD300\">PLACE<\u002Fdiv><p style=\"position:absolute;left:30px;right:26px;top:170px;margin:0;font-size:38px;font-weight:700;line-height:1.2\">Show up at your customer's moment, not just in their market.<\u002Fp><\u002Fdiv>\n<div class=\"card pp\" data-s=\"4\" style=\"left:1460px;top:140px;width:350px;height:680px;background:#000B8D;color:#F4EBEE;--r:2deg\"><div class=\"tab\">P4<\u002Fdiv><div class=\"num\" style=\"position:absolute;left:30px;top:56px;font-size:60px;color:#FFD300\">PROMOTION<\u002Fdiv><p style=\"position:absolute;left:30px;right:26px;top:170px;margin:0;font-size:38px;font-weight:700;line-height:1.2\">Be the content, not the ad break.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"12 Over to you\" style=\"background:#E21B4D;color:#F4EBEE\"><div class=\"in\">\n<div class=\"gw\" style=\"left:1180px;top:-200px;font-size:1100px;color:rgba(255,255,255,.12)\">?<\u002Fdiv>\n<div style=\"position:absolute;left:100px;top:80px\"><h1 style=\"font-size:220px;color:#F4EBEE\">Over to you<\u002Fh1><\u002Fdiv>\n<div class=\"card pp\" data-s=\"1\" style=\"left:100px;top:420px;width:560px;height:540px;background:#F4EBEE;color:#0b0b14;--r:-1.5deg\"><div class=\"tab\" style=\"background:#FFD300\">1<\u002Fdiv><p style=\"margin:0;padding:50px 34px 0;font-size:34px;font-weight:700;line-height:1.22\">Red Bull spends heavily on events that never sell a can directly. If you launched a startup with ₹5 lakh, which one of the 4Ps would you put that money into first, and why?<\u002Fp><\u002Fdiv>\n<div class=\"card pp\" data-s=\"2\" style=\"left:720px;top:340px;width:500px;height:480px;background:#FFD300;color:#0b0b14;--r:1.5deg\"><div class=\"tab\">2<\u002Fdiv><p style=\"margin:0;padding:50px 34px 0;font-size:34px;font-weight:700;line-height:1.22\">Red Bull charges more for less and still wins. When would premium pricing kill a new brand instead of building it?<\u002Fp><\u002Fdiv>\n<div class=\"card pp\" data-s=\"3\" style=\"left:1290px;top:440px;width:520px;height:480px;background:#000B8D;color:#F4EBEE;--r:-1deg\"><div class=\"tab\">3<\u002Fdiv><p style=\"margin:0;padding:50px 34px 0;font-size:34px;font-weight:700;line-height:1.22\">Should Red Bull launch a ₹30 mini can for small-town India? Would it grow sales or cheapen the brand?<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"s\" data-screen-label=\"13 Sources\" style=\"background:#000B8D;color:#F4EBEE\"><div class=\"in\">\n<div style=\"position:absolute;inset:34px;border:10px solid #FFD300\"><\u002Fdiv>\n<div class=\"vt\" style=\"left:90px;top:90px;font-size:150px;color:#FFD300\">Sources<\u002Fdiv>\n<div style=\"position:absolute;left:300px;top:90px;width:1480px;display:grid;grid-templa
